name: Security regression tests
on:
  push:
    branches: ['codex/**', 'claude/**', main]
    paths: ['supabase/**', 'FamilyTreeV2/**', 'scripts/**', 'tests/security/**', '.github/workflows/security-tests.yml']
  pull_request:
    paths:
      - 'supabase/**'
      - 'FamilyTreeV2/**'
      - 'scripts/**'
      - 'tests/security/**'
      - '.github/workflows/security-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --prefix tests/security --ignore-scripts
      - run: node tests/security/policies.mjs
      - run: node tests/security/reliability.mjs
      - run: deno test tests/security/functions_test.ts
      - run: tests/security/run-cache-tests.sh
      - run: python3 -m unittest discover -s tests/security -p '*_test.py'
