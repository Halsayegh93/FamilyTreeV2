name: Deploy edge functions (temporary)

# مؤقت — ينشر الدوال المتأثرة بطلب الهوية #83 من ملفات المستودع نفسها، ثم يُحذف الفرع.
# event-notify وweekly-digest من main كما هي (نسختاهما في الإنتاج كانت مطابقة لـ main قبل الدمج).
# push-on-notification: نسخة الإنتاج نفسها (فرع wip/ios-2026-10-02) مع سطر العنوان الافتراضي وحده.
# rapid-action لا تُنشر: موقوفة في الإنتاج.
on:
  push:
    branches: ['claude/deploy-functions-2026-10-17']

permissions:
  contents: read

concurrency:
  group: familytree-production-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: poxyxsgvzwmnmewytsiw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Check the token
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }

      - name: push-on-notification — the production source plus the default-title line
        run: |
          set -euo pipefail
          F=supabase/functions/push-on-notification/index.ts
          git show origin/wip/ios-2026-10-02:$F > "$F"
          test "$(grep -c 'record.title || "عائلة المحمدعلي 🌿"' "$F")" = 1
          sed -i 's/record.title || "عائلة المحمدعلي 🌿"/record.title || "عائلة المحمدعلي"/' "$F"
          test "$(grep -c 'record.title || "عائلة المحمدعلي";' "$F")" = 1
          test "$(grep -c 'category: "JOIN_REQUEST"' "$F")" = 1
          echo "::notice title=push-on-notification::$(git diff --numstat -- "$F" | tr '\t' ' ') vs main (expected: the join-request additions only)"

      - name: Deploy
        run: |
          set -uo pipefail
          supabase --version
          deploy() {
            local name=$1; shift
            if supabase functions deploy "$name" --project-ref "$PROJECT_REF" "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "::notice title=Deployed $name::$(tail -n 3 "$RUNNER_TEMP/$name.log" | tr -d '\r' | tr '\n' ' ' | cut -c1-300)"
            else
              msg=$(tail -n 30 "$RUNNER_TEMP/$name.log" | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Deploy failed: $name::$msg"
              exit 1
            fi
          }
          deploy event-notify
          deploy weekly-digest --no-verify-jwt
          deploy push-on-notification --no-verify-jwt
