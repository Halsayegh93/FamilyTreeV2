name: Build & Install to iPhone

# يبني النسخة على الماك (self-hosted) ويثبّتها مباشرة على الآيفون المقترن
# عبر الشبكة — بلا TestFlight وبلا فتح Xcode يدوياً.
#
# الشرط: الآيفون مقترن بالماك ومتصل بنفس الشبكة (Xcode ▸ Devices ▸ Connect via network).

on:
  # الدفع إلى هذا الفرع يشغّل البناء والتثبيت — لا يتأثر أي فرع تطوير آخر.
  push:
    branches:
      - 'release/device-install'
  workflow_dispatch:

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 40

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unlock Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db
          security set-keychain-settings -t 3600 ~/Library/Keychains/login.keychain-db

      - name: Setup API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Find the connected iPhone
        run: |
          xcrun devicectl list devices --json-output "$RUNNER_TEMP/devices.json" || true
          echo "──────── الأجهزة المرئية ────────"
          xcrun devicectl list devices || true

          UDID=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          try:
              devices = json.load(open(sys.argv[1]))["result"]["devices"]
          except Exception:
              devices = []

          def is_iphone(d):
              platform = d.get("hardwareProperties", {}).get("platform", "")
              return platform == "iOS"

          def is_reachable(d):
              state = d.get("connectionProperties", {}).get("tunnelState", "")
              return state != "unavailable"

          candidates = [d for d in devices if is_iphone(d) and is_reachable(d)] \
                    or [d for d in devices if is_iphone(d)]

          if not candidates:
              sys.exit(1)

          d = candidates[0]
          print(d["hardwareProperties"]["udid"])
          PY
          ) || {
            echo "::error::لم يُعثر على آيفون مقترن بالماك. افتح Xcode ▸ Window ▸ Devices and Simulators وتأكد أن الجهاز مقترن ومتصل بالشبكة."
            exit 1
          }

          NAME=$(python3 - "$RUNNER_TEMP/devices.json" "$UDID" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["result"]["devices"]
          for d in devices:
              if d["hardwareProperties"]["udid"] == sys.argv[2]:
                  print(d.get("deviceProperties", {}).get("name", "iPhone"))
                  break
          PY
          )

          echo "DEVICE_UDID=$UDID" >> $GITHUB_ENV
          echo "DEVICE_NAME=$NAME" >> $GITHUB_ENV
          echo "الجهاز المستهدف: $NAME ($UDID)"

      - name: Build for the device
        run: |
          xcodebuild build \
            -project FamilyTreeV2.xcodeproj \
            -scheme FamilyTreeV2 \
            -configuration Debug \
            -destination "platform=iOS,id=$DEVICE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=G8GVN83P97

      - name: Install on the iPhone
        run: |
          APP_PATH="$RUNNER_TEMP/dd/Build/Products/Debug-iphoneos/FamilyTreeV2.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::لم يُنتج البناء تطبيقاً في $APP_PATH"
            exit 1
          fi
          xcrun devicectl device install app --device "$DEVICE_UDID" "$APP_PATH"
          echo "تم تثبيت النسخة الجديدة على $DEVICE_NAME"

      - name: Smoke test — هل يبقى التطبيق شغّالاً؟
        id: smoke
        run: |
          set +e
          # نشغّل بلا --console حتى لا يرتبط عمر التطبيق بعمر الأداة:
          # سابقاً كان إنهاء الأداة بعد المهلة يُنهي التطبيق بإشارة 15
          # فيُقرأ خطأً كانهيار ويُستعاد الإصدار القديم بلا داعٍ.
          LAUNCH_OUT=$(xcrun devicectl device process launch \
            --device "$DEVICE_UDID" \
            --terminate-existing \
            --json-output "$RUNNER_TEMP/launch.json" \
            Hasan.FamilyTreeV2 2>&1)
          echo "$LAUNCH_OUT"

          PID_ON_DEVICE=$(python3 - "$RUNNER_TEMP/launch.json" <<'PY'
          import json, sys
          try:
              j = json.load(open(sys.argv[1]))
              print(j["result"]["process"]["processIdentifier"])
          except Exception:
              print("")
          PY
          )
          echo "PID على الجهاز: ${PID_ON_DEVICE:-غير معروف}"

          sleep 25

          # هل ما زالت العملية حيّة بعد 25 ثانية؟
          xcrun devicectl device info processes \
            --device "$DEVICE_UDID" \
            --json-output "$RUNNER_TEMP/procs.json" > /dev/null 2>&1

          ALIVE=$(python3 - "$RUNNER_TEMP/procs.json" "$PID_ON_DEVICE" <<'PY'
          import json, sys
          try:
              procs = json.load(open(sys.argv[1]))["result"]["runningProcesses"]
          except Exception:
              procs = []
          want = sys.argv[2]
          for p in procs:
              path = str(p.get("executable", ""))
              pid = str(p.get("processIdentifier", ""))
              if "FamilyTreeV2.app" in path and (not want or pid == want):
                  print("yes"); break
          else:
              print("no")
          PY
          )

          if [ "$ALIVE" != "yes" ]; then
            echo "::error::التطبيق لم يبقَ شغّالاً 25 ثانية — سيُستعاد الإصدار المستقر"
            exit 1
          fi
          echo "✅ التطبيق بقي شغّالاً 25 ثانية بلا انهيار"

      # ── شبكة أمان: لو انهارت النسخة الجديدة، نعيد main فوراً ──
      # حتى لا يبقى الجهاز على نسخة معطّلة في أي حال.
      - name: Checkout main for rollback
        if: failure()
        uses: actions/checkout@v4
        with:
          # آخر نسخة ثبت أنها تعمل على الجهاز
          ref: release/device-stable
          path: rollback-src

      - name: Rollback to the stable build
        if: failure()
        run: |
          echo "⚠️ استعادة الإصدار المستقر من main"
          xcodebuild build \
            -project rollback-src/FamilyTreeV2.xcodeproj \
            -scheme FamilyTreeV2 \
            -configuration Debug \
            -destination "platform=iOS,id=$DEVICE_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd-rollback" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=G8GVN83P97

          xcrun devicectl device install app \
            --device "$DEVICE_UDID" \
            "$RUNNER_TEMP/dd-rollback/Build/Products/Debug-iphoneos/FamilyTreeV2.app"
          echo "✅ تمت استعادة الإصدار المستقر على $DEVICE_NAME"

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dd" "$RUNNER_TEMP/dd-rollback"
          rm -rf ~/.private_keys 2>/dev/null || true
