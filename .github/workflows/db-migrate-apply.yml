name: Apply FamilyTree migration
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'File inside supabase/migrations (review before running)'
        required: true
permissions:
  contents: read
concurrency:
  group: familytree-production-migrations
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: poxyxsgvzwmnmewytsiw
      MIGRATION: ${{ inputs.migration }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Validate migration path
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          candidate=pathlib.Path(os.environ['MIGRATION'])
          root=pathlib.Path('supabase/migrations').resolve()
          if not candidate.is_file() or candidate.resolve().parent != root or not re.fullmatch(r'\d{14}_[A-Za-z0-9_]+\.sql',candidate.name):
              raise SystemExit('Expected a timestamped SQL file directly inside supabase/migrations')
          if not os.environ.get('SUPABASE_ACCESS_TOKEN'):
              raise SystemExit('SUPABASE_ACCESS_TOKEN secret is missing')
          PY
      - name: Link verified FamilyTree project
        run: supabase link --project-ref "$PROJECT_REF" --yes
      - name: Apply migration and record history
        run: |
          set -euo pipefail
          supabase db query --linked --file "$MIGRATION" > /tmp/migration-result.json
          VERSION="$(basename "$MIGRATION")"
          VERSION="${VERSION%%_*}"
          supabase migration repair "$VERSION" --status applied --linked
