name: Diagnose app on iPhone

# يشغّل التطبيق على الآيفون المقترن ويلتقط مخرجاته وسجلّ النظام،
# ليظهر سبب أي انهيار عند الإقلاع.

on:
  push:
    branches:
      - 'release/device-diagnose'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 20

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      BUNDLE_ID: Hasan.FamilyTreeV2

    steps:
      - name: Find the connected iPhone
        run: |
          xcrun devicectl list devices --json-output "$RUNNER_TEMP/devices.json" || true
          UDID=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          try:
              devices = json.load(open(sys.argv[1]))["result"]["devices"]
          except Exception:
              devices = []
          ios = [d for d in devices if d.get("hardwareProperties", {}).get("platform") == "iOS"]
          reachable = [d for d in ios
                       if d.get("connectionProperties", {}).get("tunnelState") != "unavailable"]
          pick = (reachable or ios)
          if not pick:
              sys.exit(1)
          print(pick[0]["hardwareProperties"]["udid"])
          PY
          ) || { echo "::error::لم يُعثر على آيفون مقترن"; exit 1; }
          echo "DEVICE_UDID=$UDID" >> $GITHUB_ENV
          echo "الجهاز: $UDID"

      - name: Launch the app and capture output
        continue-on-error: true
        run: |
          set +e
          LOG="$RUNNER_TEMP/launch.log"
          SYSLOG="$RUNNER_TEMP/syslog.log"

          # سجلّ النظام من الجهاز يعمل بالتوازي مع التشغيل
          xcrun devicectl device console --device "$DEVICE_UDID" > "$SYSLOG" 2>&1 &
          CONSOLE_PID=$!

          sleep 3

          xcrun devicectl device process launch \
            --device "$DEVICE_UDID" \
            --console \
            --terminate-existing \
            "$BUNDLE_ID" > "$LOG" 2>&1 &
          LAUNCH_PID=$!

          # ننتظر 30 ثانية ثم نوقف الالتقاط (macOS بلا أمر timeout)
          sleep 30
          kill "$LAUNCH_PID" 2>/dev/null
          kill "$CONSOLE_PID" 2>/dev/null
          wait "$LAUNCH_PID" 2>/dev/null
          wait "$CONSOLE_PID" 2>/dev/null

          echo "════════ مخرجات تشغيل التطبيق ════════"
          cat "$LOG" 2>/dev/null || echo "(فارغ)"

          echo ""
          echo "════════ أسطر النظام المتعلقة بالتطبيق ════════"
          grep -iE "familytree|Hasan\.FamilyTreeV2|crash|fatal|exception|terminat|signal|SIGABRT|dyld|Library not loaded|assert" \
            "$SYSLOG" 2>/dev/null | head -80 || echo "(لا شيء)"

      - name: Crash reports on the device
        continue-on-error: true
        run: |
          set +e
          echo "════════ تقارير الانهيار ════════"
          for DIR in \
            "$HOME/Library/Logs/CrashReporter/MobileDevice" \
            "$HOME/Library/Logs/DiagnosticReports"
          do
            [ -d "$DIR" ] || continue
            FOUND=$(find "$DIR" -name "*FamilyTreeV2*" -type f -mtime -1 2>/dev/null | head -3)
            for F in $FOUND; do
              echo "── $F ──"
              head -100 "$F"
            done
          done
          echo "(انتهى)"
