name: Diagnose app on iPhone

# قراءة فقط: يسحب تقارير الانهيار المحفوظة على الجهاز من المحاولات السابقة.
# لا يبني ولا يثبّت ولا يشغّل أي شيء على الآيفون.

on:
  push:
    branches:
      - 'release/device-diagnose'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 10

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Find the connected iPhone
        run: |
          xcrun devicectl list devices --json-output "$RUNNER_TEMP/devices.json" || true
          UDID=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          try:
              devices = json.load(open(sys.argv[1]))["result"]["devices"]
          except Exception:
              devices = []
          ios = [d for d in devices if d.get("hardwareProperties", {}).get("platform") == "iOS"]
          reachable = [d for d in ios
                       if d.get("connectionProperties", {}).get("tunnelState") != "unavailable"]
          pick = (reachable or ios)
          if not pick:
              sys.exit(1)
          print(pick[0]["hardwareProperties"]["udid"])
          PY
          ) || { echo "::error::لم يُعثر على آيفون مقترن"; exit 1; }
          echo "DEVICE_UDID=$UDID" >> $GITHUB_ENV

      - name: Pull crash reports (read-only, with hard time limit)
        continue-on-error: true
        run: |
          set +e
          OUT="$RUNNER_TEMP/crash"
          rm -rf "$OUT"; mkdir -p "$OUT"

          # كل محاولة في الخلفية مع حدّ زمني، حتى لا تعلق المهمة
          xcrun devicectl device copy from \
            --device "$DEVICE_UDID" \
            --domain-type systemCrashLogs \
            --source . \
            --destination "$OUT" > "$RUNNER_TEMP/copy.log" 2>&1 &
          COPY_PID=$!

          WAITED=0
          while kill -0 "$COPY_PID" 2>/dev/null && [ "$WAITED" -lt 150 ]; do
            sleep 5
            WAITED=$((WAITED + 5))
          done
          kill "$COPY_PID" 2>/dev/null
          wait "$COPY_PID" 2>/dev/null

          echo "════════ مخرجات السحب ════════"
          tail -20 "$RUNNER_TEMP/copy.log" 2>/dev/null

          echo "════════ تقارير التطبيق ════════"
          find "$OUT" -iname "*FamilyTree*" -type f 2>/dev/null | head -20

          LATEST=$(find "$OUT" -iname "*FamilyTree*" -type f 2>/dev/null \
                   | xargs -r ls -t 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            echo "════════ أحدث تقرير: $LATEST ════════"
            head -250 "$LATEST"
          else
            echo "(لم يُعثر على تقرير للتطبيق)"
          fi
