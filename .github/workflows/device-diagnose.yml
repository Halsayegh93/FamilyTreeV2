name: Diagnose app on iPhone

# يشغّل التطبيق على الآيفون المقترن ويطبع مخرجاته وسبب أي انهيار،
# ثم يسحب تقارير الانهيار الحديثة من الجهاز.

on:
  push:
    branches:
      - 'release/device-diagnose'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 20

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      BUNDLE_ID: Hasan.FamilyTreeV2

    steps:
      - name: Find the connected iPhone
        run: |
          xcrun devicectl list devices --json-output "$RUNNER_TEMP/devices.json" || true
          UDID=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          try:
              devices = json.load(open(sys.argv[1]))["result"]["devices"]
          except Exception:
              devices = []
          ios = [d for d in devices if d.get("hardwareProperties", {}).get("platform") == "iOS"]
          reachable = [d for d in ios
                       if d.get("connectionProperties", {}).get("tunnelState") != "unavailable"]
          pick = (reachable or ios)
          if not pick:
              sys.exit(1)
          print(pick[0]["hardwareProperties"]["udid"])
          PY
          ) || { echo "::error::لم يُعثر على آيفون مقترن"; exit 1; }
          echo "DEVICE_UDID=$UDID" >> $GITHUB_ENV
          echo "الجهاز: $UDID"

      - name: Launch the app and capture output
        continue-on-error: true
        run: |
          echo "════════ تشغيل التطبيق ════════"
          set +e
          timeout 70 xcrun devicectl device process launch \
            --device "$DEVICE_UDID" \
            --console \
            --terminate-existing \
            "$BUNDLE_ID" 2>&1 | tee "$RUNNER_TEMP/launch.log"
          echo "════════ رمز الخروج: $? ════════"

      - name: Recent crash reports for the app
        continue-on-error: true
        run: |
          echo "════════ تقارير الانهيار على الماك ════════"
          CRASH_DIR="$HOME/Library/Logs/CrashReporter/MobileDevice"
          if [ -d "$CRASH_DIR" ]; then
            LATEST=$(find "$CRASH_DIR" -name "FamilyTreeV2*" -type f -mtime -1 2>/dev/null \
                     | xargs -r ls -t 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              echo "── $LATEST ──"
              head -120 "$LATEST"
            else
              echo "لا توجد تقارير انهيار محفوظة على الماك لهذا التطبيق."
            fi
          else
            echo "مجلد تقارير الانهيار غير موجود على الماك."
          fi

      - name: Device console around the crash
        continue-on-error: true
        run: |
          echo "════════ سجلّ النظام من الجهاز ════════"
          timeout 60 xcrun devicectl device info processes \
            --device "$DEVICE_UDID" 2>&1 | grep -i familytree || true
